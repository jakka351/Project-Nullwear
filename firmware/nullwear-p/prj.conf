#
# Project NULLWEAR — App-core Kconfig
#
# Minimal Zephyr feature set: I2C, GPIO, PWM, IPC, logging, USB-CDC for
# debug. No Bluetooth host stack — the radio is owned by the network
# core in raw mode.
#
# SPDX-License-Identifier: MIT
#

# --- General ---
CONFIG_MAIN_STACK_SIZE=4096
CONFIG_SYSTEM_WORKQUEUE_STACK_SIZE=2048
CONFIG_REBOOT=y
CONFIG_ASSERT=y

# --- Logging ---
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_LOG_BUFFER_SIZE=4096
CONFIG_LOG_DEFAULT_LEVEL=3
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# --- I2C (MAX17048 fuel gauge) ---
CONFIG_I2C=y

# --- GPIO (charger STAT, button) ---
CONFIG_GPIO=y

# --- PWM (RGB LED) ---
CONFIG_PWM=y

# --- IPC service (network core <-> app core) ---
CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y

# --- Power management ---
CONFIG_PM=y
CONFIG_PM_DEVICE=y

# --- USB-CDC for engineering / depot diagnostics over USB ---
CONFIG_USB_DEVICE_STACK=y
CONFIG_USB_DEVICE_PRODUCT="NULLWEAR/P"
CONFIG_USB_DEVICE_MANUFACTURER="Tester Present"
CONFIG_USB_DEVICE_VID=0x2FE3
CONFIG_USB_DEVICE_PID=0x0001
CONFIG_USB_DEVICE_INITIALIZE_AT_BOOT=n
CONFIG_UART_LINE_CTRL=y

# --- Bootloader: MCUboot for signed firmware updates over USB-CDC ---
CONFIG_BOOTLOADER_MCUBOOT=y
CONFIG_MCUBOOT_SIGNATURE_KEY_FILE="root-ed25519.pem"

# --- No Bluetooth host stack on app core ---
CONFIG_BT=n
