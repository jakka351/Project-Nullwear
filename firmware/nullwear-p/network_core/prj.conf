#
# Project NULLWEAR — Network-core Kconfig
#
# Bare-minimum Zephyr config: we manage the RADIO peripheral directly,
# bypassing the Bluetooth Controller subsystem. This is intentional —
# the BLE stack does not expose the per-packet timing primitives we
# need for reactive CRC corruption.
#
# SPDX-License-Identifier: MIT
#

CONFIG_MAIN_STACK_SIZE=2048

# Logging via RTT (no UART on net-core in production)
CONFIG_LOG=y
CONFIG_LOG_MODE_DEFERRED=y
CONFIG_USE_SEGGER_RTT=y
CONFIG_LOG_BACKEND_RTT=y
CONFIG_LOG_BACKEND_UART=n

# IPC service (back to app core for stats)
CONFIG_IPC_SERVICE=y
CONFIG_MBOX=y

# DPPI / nrfx HALs (raw radio access)
CONFIG_NRFX_DPPI=y
CONFIG_NRFX_TIMER0=y

# Bluetooth controller and host both DISABLED — we do not use them.
CONFIG_BT=n
CONFIG_BT_CTLR=n

# We need direct ownership of the RADIO peripheral
CONFIG_NRF_RTC_TIMER=y
