<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 520" width="900" height="520">
  <defs>
    <marker id="arrow" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L8,4 z" fill="#0B1B33"/>
    </marker>
    <marker id="arrow-red" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L8,4 z" fill="#991B1B"/>
    </marker>
    <marker id="arrow-green" markerWidth="8" markerHeight="8" refX="7" refY="4" orient="auto" markerUnits="strokeWidth">
      <path d="M0,0 L0,8 L8,4 z" fill="#065F46"/>
    </marker>
  </defs>

  <!-- background -->
  <rect width="900" height="520" fill="#FFFFFF"/>

  <!-- title -->
  <text x="450" y="28" font-family="Helvetica, Arial, sans-serif" font-size="18" font-weight="bold" text-anchor="middle" fill="#0B1B33">PROJECT NULLWEAR — System Architecture</text>
  <text x="450" y="48" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">How a personal-issue radio device makes an officer invisible to a third-party scanner mesh</text>

  <!-- WITHOUT NULLWEAR (left) -->
  <g>
    <text x="200" y="78" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#991B1B">WITHOUT NULLWEAR</text>
    <text x="200" y="94" font-family="Helvetica" font-size="11" text-anchor="middle" fill="#666">Officer is broadcasting; attacker hears them</text>

    <!-- Officer -->
    <circle cx="100" cy="200" r="22" fill="#0B1B33"/>
    <text x="100" y="205" font-family="Helvetica" font-size="11" font-weight="bold" text-anchor="middle" fill="white">OFFICER</text>
    <!-- Axon device -->
    <rect x="80" y="232" width="40" height="22" fill="#1A3060" rx="3"/>
    <text x="100" y="247" font-family="Helvetica" font-size="9" font-weight="bold" text-anchor="middle" fill="white">AXON</text>
    <!-- Radio waves -->
    <g fill="none" stroke="#991B1B" stroke-width="1.5">
      <circle cx="100" cy="240" r="40" stroke-opacity="0.7"/>
      <circle cx="100" cy="240" r="60" stroke-opacity="0.45"/>
      <circle cx="100" cy="240" r="80" stroke-opacity="0.25"/>
    </g>
    <text x="100" y="350" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#991B1B">BLE adv: 00:25:DF:xx:xx:xx</text>
    <text x="100" y="362" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#991B1B">~30 packets/sec</text>

    <!-- Attacker scanner -->
    <rect x="270" y="220" width="60" height="40" fill="#FFE4B5" stroke="#B45309" stroke-width="1.2"/>
    <text x="300" y="237" font-family="Helvetica" font-size="9" font-weight="bold" text-anchor="middle" fill="#0B1B33">SCANNER</text>
    <text x="300" y="251" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#0B1B33">(rooftop)</text>
    <line x1="180" y1="240" x2="265" y2="240" stroke="#991B1B" stroke-width="1.5" marker-end="url(#arrow-red)"/>
    <text x="223" y="232" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#991B1B">DETECTED</text>

    <!-- Cloud -->
    <ellipse cx="200" cy="430" rx="55" ry="22" fill="#0B1B33"/>
    <text x="200" y="435" font-family="Helvetica" font-size="10" font-weight="bold" text-anchor="middle" fill="white">CLOUD</text>
    <line x1="300" y1="265" x2="225" y2="412" stroke="#991B1B" stroke-width="1.2" marker-end="url(#arrow-red)"/>
    <text x="280" y="350" font-family="Helvetica" font-size="9" fill="#991B1B" transform="rotate(-50 280 350)">POST /alert</text>

    <!-- Dashboard -->
    <rect x="270" y="380" width="60" height="40" fill="#FDECEA" stroke="#991B1B" stroke-width="1.2"/>
    <text x="300" y="397" font-family="Helvetica" font-size="9" font-weight="bold" text-anchor="middle" fill="#991B1B">LIVE MAP</text>
    <text x="300" y="411" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#991B1B">officer here</text>
    <line x1="245" y1="421" x2="265" y2="410" stroke="#991B1B" stroke-width="1.2" marker-end="url(#arrow-red)"/>
  </g>

  <!-- divider -->
  <line x1="450" y1="70" x2="450" y2="495" stroke="#CCC" stroke-dasharray="6,4" stroke-width="1"/>

  <!-- WITH NULLWEAR (right) -->
  <g>
    <text x="700" y="78" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#065F46">WITH NULLWEAR</text>
    <text x="700" y="94" font-family="Helvetica" font-size="11" text-anchor="middle" fill="#666">Packet annihilated mid-flight; attacker hears nothing</text>

    <!-- Officer -->
    <circle cx="600" cy="200" r="22" fill="#0B1B33"/>
    <text x="600" y="205" font-family="Helvetica" font-size="11" font-weight="bold" text-anchor="middle" fill="white">OFFICER</text>
    <!-- Axon device -->
    <rect x="580" y="232" width="40" height="22" fill="#1A3060" rx="3"/>
    <text x="600" y="247" font-family="Helvetica" font-size="9" font-weight="bold" text-anchor="middle" fill="white">AXON</text>
    <!-- NULLWEAR -->
    <rect x="624" y="232" width="40" height="22" fill="#065F46" rx="3"/>
    <text x="644" y="247" font-family="Helvetica" font-size="9" font-weight="bold" text-anchor="middle" fill="white">NW/P</text>

    <!-- Protection bubble -->
    <circle cx="615" cy="240" r="120" fill="none" stroke="#065F46" stroke-width="2" stroke-dasharray="4,3" opacity="0.7"/>
    <text x="615" y="380" font-family="Helvetica" font-size="10" font-weight="bold" text-anchor="middle" fill="#065F46">PROTECTION BUBBLE (~30 m radius)</text>

    <!-- Axon outgoing wave hits jam pulse -->
    <g fill="none" stroke="#991B1B" stroke-width="1.5">
      <path d="M 600,240 q 30,-15 60,-30" stroke-opacity="0.7"/>
    </g>
    <!-- Jam X -->
    <g stroke="#FF4040" stroke-width="3" stroke-linecap="round">
      <line x1="710" y1="200" x2="730" y2="220"/>
      <line x1="730" y1="200" x2="710" y2="220"/>
    </g>
    <text x="720" y="190" font-family="Helvetica" font-size="9" font-weight="bold" text-anchor="middle" fill="#FF4040">JAM</text>

    <!-- Attacker scanner -->
    <rect x="770" y="220" width="60" height="40" fill="#FFE4B5" stroke="#B45309" stroke-width="1.2"/>
    <text x="800" y="237" font-family="Helvetica" font-size="9" font-weight="bold" text-anchor="middle" fill="#0B1B33">SCANNER</text>
    <text x="800" y="251" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#0B1B33">(rooftop)</text>
    <line x1="745" y1="240" x2="765" y2="240" stroke="#999" stroke-width="1.2" stroke-dasharray="3,3"/>
    <text x="755" y="232" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#666">no packet</text>

    <!-- Cloud -->
    <ellipse cx="700" cy="430" rx="55" ry="22" fill="#0B1B33"/>
    <text x="700" y="435" font-family="Helvetica" font-size="10" font-weight="bold" text-anchor="middle" fill="white">CLOUD</text>
    <line x1="800" y1="265" x2="725" y2="412" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
    <text x="780" y="350" font-family="Helvetica" font-size="9" fill="#666" transform="rotate(-50 780 350)">silence</text>

    <!-- Dashboard -->
    <rect x="770" y="380" width="60" height="40" fill="#ECFDF5" stroke="#065F46" stroke-width="1.2"/>
    <text x="800" y="397" font-family="Helvetica" font-size="9" font-weight="bold" text-anchor="middle" fill="#065F46">LIVE MAP</text>
    <text x="800" y="411" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#065F46">officer absent</text>
    <line x1="745" y1="421" x2="765" y2="410" stroke="#999" stroke-width="1" stroke-dasharray="3,3"/>
  </g>

  <!-- bottom note -->
  <rect x="80" y="475" width="740" height="34" fill="#FDECEA" stroke="#991B1B"/>
  <text x="450" y="498" font-family="Helvetica" font-size="11" text-anchor="middle" fill="#0B1B33">
    Decoys add noise to the attacker's input. NULLWEAR removes the signal from the attacker's input. There is nothing left to filter.
  </text>
</svg>
