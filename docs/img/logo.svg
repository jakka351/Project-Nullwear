        font-style: italic;
        fill: #1A33E5;
        letter-spacing: -2px;
      }
    ]]></style>
  </defs>

  <!-- "Police" in script blue (same heritage as the original) -->
  <text x="20" y="110" class="police-script" font-size="96">Police</text>

