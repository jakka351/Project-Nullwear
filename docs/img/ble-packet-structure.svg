<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 536 280" width="536" height="280">
<text x="268" y="22" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#0B1B33">BLE Advertising Packet — Structure and Timing (1 Mbps PHY)</text>
<text x="268" y="40" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#666">Field widths in bytes; horizontal scale 2 pixels per microsecond on the air</text>
<rect x="60" y="70" width="16" height="60" fill="#E5E7EB" stroke="#333" stroke-width="0.6"/>
<rect x="76" y="70" width="64" height="60" fill="#D1D5DB" stroke="#333" stroke-width="0.6"/>
<text x="108.0" y="92" font-family="Helvetica" font-size="9" font-weight="bold" text-anchor="middle">Access Addr</text>
<text x="108.0" y="108" font-family="Helvetica" font-size="7.5" text-anchor="middle" fill="#444">0x8E89BED6</text>
<text x="108.0" y="122" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#444">32b / 32us</text>
<rect x="140" y="70" width="32" height="60" fill="#E0E7FF" stroke="#333" stroke-width="0.6"/>
<text x="156.0" y="92" font-family="Helvetica" font-size="9" font-weight="bold" text-anchor="middle">PDU Header</text>
<text x="156.0" y="108" font-family="Helvetica" font-size="7.5" text-anchor="middle" fill="#444">2 B</text>
<text x="156.0" y="122" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#444">16b / 16us</text>
<rect x="172" y="70" width="48" height="60" fill="#E0E7FF" stroke="#333" stroke-width="0.6"/>
<text x="196.0" y="92" font-family="Helvetica" font-size="9" font-weight="bold" text-anchor="middle">AdvA[0..2]</text>
<text x="196.0" y="108" font-family="Helvetica" font-size="7.5" text-anchor="middle" fill="#444">MAC NIC bytes</text>
<text x="196.0" y="122" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#444">24b / 24us</text>
<rect x="220" y="70" width="48" height="60" fill="#FCD9D9" stroke="#333" stroke-width="0.6"/>
<text x="244.0" y="92" font-family="Helvetica" font-size="9" font-weight="bold" text-anchor="middle">AdvA[3..5]</text>
<text x="244.0" y="108" font-family="Helvetica" font-size="7.5" text-anchor="middle" fill="#444">OUI = 00:25:DF</text>
<text x="244.0" y="122" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#444">24b / 24us</text>
<rect x="268" y="70" width="160" height="60" fill="#E0E7FF" stroke="#333" stroke-width="0.6"/>
<text x="348.0" y="92" font-family="Helvetica" font-size="9" font-weight="bold" text-anchor="middle">AdvData</text>
<text x="348.0" y="108" font-family="Helvetica" font-size="7.5" text-anchor="middle" fill="#444">service data (~10 B)</text>
<text x="348.0" y="122" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#444">80b / 80us</text>
<rect x="428" y="70" width="48" height="60" fill="#FED7AA" stroke="#333" stroke-width="0.6"/>
<text x="452.0" y="92" font-family="Helvetica" font-size="9" font-weight="bold" text-anchor="middle">CRC</text>
<text x="452.0" y="108" font-family="Helvetica" font-size="7.5" text-anchor="middle" fill="#444">3 B trailer</text>
<text x="452.0" y="122" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#444">24b / 24us</text>
<line x1="60" y1="142" x2="476" y2="142" stroke="#333" stroke-width="0.6"/>
<line x1="76" y1="139" x2="76" y2="145" stroke="#333" stroke-width="0.5"/>
<text x="76" y="157" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#555">8us</text>
<line x1="140" y1="139" x2="140" y2="145" stroke="#333" stroke-width="0.5"/>
<text x="140" y="157" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#555">40us</text>
<line x1="172" y1="139" x2="172" y2="145" stroke="#333" stroke-width="0.5"/>
<text x="172" y="157" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#555">56us</text>
<line x1="220" y1="139" x2="220" y2="145" stroke="#333" stroke-width="0.5"/>
<text x="220" y="157" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#555">80us</text>
<line x1="268" y1="139" x2="268" y2="145" stroke="#333" stroke-width="0.5"/>
<text x="268" y="157" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#555">104us</text>
<line x1="428" y1="139" x2="428" y2="145" stroke="#333" stroke-width="0.5"/>
<text x="428" y="157" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#555">184us</text>
<line x1="476" y1="139" x2="476" y2="145" stroke="#333" stroke-width="0.5"/>
<text x="476" y="157" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#555">208us</text>
<line x1="268" y1="70" x2="268" y2="180" stroke="#065F46" stroke-width="1.5" stroke-dasharray="3,2"/>
<text x="268" y="190" font-family="Helvetica" font-size="9" font-weight="bold" text-anchor="middle" fill="#065F46">OUI detected</text>
<text x="268" y="202" font-family="Helvetica" font-size="8" text-anchor="middle" fill="#065F46">(BCMATCH at 104 us)</text>
<rect x="368" y="52" width="118" height="14" fill="#FECACA" stroke="#991B1B" stroke-width="1"/>
<text x="422.0" y="63" font-family="Helvetica" font-size="9" font-weight="bold" text-anchor="middle" fill="#991B1B">NULLWEAR JAM PULSE</text>
<line x1="268" y1="59" x2="368" y2="59" stroke="#991B1B" stroke-width="0.8" stroke-dasharray="2,2"/>
<text x="318.0" y="55" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#991B1B">RX→TX (~50 us)</text>
<text x="268" y="250" font-family="Helvetica" font-size="11" font-weight="bold" text-anchor="middle" fill="#991B1B">Result: jam pulse overlaps the CRC region. Receiver computes wrong CRC. Packet silently discarded.</text>
<text x="268" y="268" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#666">For typical Axon advertisements (≥ 10 B AdvData), timing has comfortable margin. For minimum-length advertisements the jam may be partial; corruption probability remains very high.</text>
</svg>