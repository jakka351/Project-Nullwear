<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 480" width="900" height="480">
<text x="450" y="26" font-family="Helvetica" font-size="16" font-weight="bold" text-anchor="middle" fill="#0B1B33">NULLWEAR Deployment Topology — three layers, one mesh</text>
<text x="450" y="46" font-family="Helvetica" font-size="11" text-anchor="middle" fill="#666">Continuous coverage of the officer's entire duty cycle: locker → briefing → vehicle → patrol → vehicle → station.</text>
<circle cx="150" cy="220" r="100" fill="#0B1B33" fill-opacity="0.08" stroke="#0B1B33" stroke-width="1.5" stroke-dasharray="4,3"/>
<circle cx="150" cy="205" r="14" fill="#0B1B33"/>
<rect x="138" y="219" width="24" height="36" fill="#0B1B33" rx="4"/>
<text x="150" y="310" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#0B1B33">NULLWEAR/P</text>
<text x="150" y="326" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#444">Body-worn</text>
<text x="150" y="340" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#444">Range: 10–30 m</text>
<text x="150" y="365" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#666">• Belt clip / body-cam mount</text>
<text x="150" y="379" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#666">• 200 mAh LiPo battery</text>
<text x="150" y="393" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#666">• USB-C charge</text>
<text x="150" y="407" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#666">• 18–24 hour shift life</text>
<text x="150" y="421" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#666">• Issued one per officer</text>
<circle cx="450" cy="220" r="130" fill="#1A3060" fill-opacity="0.08" stroke="#1A3060" stroke-width="1.5" stroke-dasharray="4,3"/>
<polygon points="410,230 410,212 425,198 475,198 490,212 490,230" fill="#1A3060"/>
<circle cx="428" cy="232" r="6" fill="#222"/>
<circle cx="472" cy="232" r="6" fill="#222"/>
<text x="450" y="310" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#1A3060">NULLWEAR/V</text>
<text x="450" y="326" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#444">Vehicle-mounted</text>
<text x="450" y="340" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#444">Range: 30–50 m</text>
<text x="450" y="365" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#666">• 12 V hardwired</text>
<text x="450" y="379" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#666">• External roof antenna</text>
<text x="450" y="393" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#666">• Covers officer + vehicle</text>
<text x="450" y="407" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#666">• Indefinite operation</text>
<text x="450" y="421" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#666">• One per patrol vehicle</text>
<circle cx="750" cy="220" r="130" fill="#3A5080" fill-opacity="0.08" stroke="#3A5080" stroke-width="1.5" stroke-dasharray="4,3"/>
<rect x="700" y="190" width="100" height="60" fill="#3A5080"/>
<rect x="710" y="200" width="15" height="15" fill="white"/>
<rect x="735" y="200" width="15" height="15" fill="white"/>
<rect x="760" y="200" width="15" height="15" fill="white"/>
<rect x="740" y="225" width="20" height="25" fill="white"/>
<text x="750" y="310" font-family="Helvetica" font-size="14" font-weight="bold" text-anchor="middle" fill="#3A5080">NULLWEAR/S</text>
<text x="750" y="326" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#444">Station-mounted</text>
<text x="750" y="340" font-family="Helvetica" font-size="10" text-anchor="middle" fill="#444">Building-scale</text>
<text x="750" y="365" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#666">• Mains-powered + UPS</text>
<text x="750" y="379" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#666">• Distributed antennas</text>
<text x="750" y="393" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#666">• 8 ports per central unit</text>
<text x="750" y="407" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#666">• Briefing room, locker, muster</text>
<text x="750" y="421" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#666">• One per police station</text>
<rect x="50" y="430" width="800" height="40" fill="#ECFDF5" stroke="#065F46" stroke-width="1"/>
<text x="450" y="453" font-family="Helvetica" font-size="11" font-weight="bold" text-anchor="middle" fill="#065F46">All three variants share the same SoC and firmware. Bug fixes propagate across all variants from one rebuild.</text>
</svg>