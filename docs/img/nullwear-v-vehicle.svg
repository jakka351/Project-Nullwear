<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 560" width="900" height="560">
  <defs>
    <marker id="cv" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto" markerUnits="strokeWidth">
      <circle cx="3" cy="3" r="2" fill="#0B1B33"/>
    </marker>
    <linearGradient id="caseV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1A3060"/>
      <stop offset="55%" stop-color="#0B1B33"/>
      <stop offset="100%" stop-color="#050D1C"/>
    </linearGradient>
    <linearGradient id="topV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#2A4280"/>
      <stop offset="100%" stop-color="#142450"/>
    </linearGradient>
    <linearGradient id="bracketV" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#9CA3AF"/>
      <stop offset="100%" stop-color="#4B5563"/>
    </linearGradient>
    <radialGradient id="ledOn" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#065F46"/>
    </radialGradient>
    <radialGradient id="ledRed" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </radialGradient>
    <radialGradient id="ledAmber" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#92400E"/>
    </radialGradient>
    <radialGradient id="ledBlue" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="900" height="560" fill="#FFFFFF"/>

  <!-- title -->
  <text x="450" y="32" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0B1B33">NULLWEAR/V — Vehicle Unit</text>
  <text x="450" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Patrol-vehicle mounted, console / dash / glovebox installable. 12 V vehicle bus, ~8 W max.</text>

  <!-- ===================== FRONT FACE (LEFT) ===================== -->
  <g transform="translate(40,90)">
    <text x="190" y="-12" font-family="Helvetica" font-size="13" font-weight="bold" text-anchor="middle" fill="#0B1B33">FRONT FACE</text>

    <!-- chassis -->
    <rect x="0" y="0" width="380" height="180" rx="14" fill="url(#caseV)" stroke="#000" stroke-width="1.4"/>
    <!-- bevelled top edge -->
    <rect x="0" y="0" width="380" height="14" rx="14" fill="url(#topV)" opacity="0.85"/>
    <!-- side seam -->
    <line x1="0" y1="14" x2="380" y2="14" stroke="#000" stroke-opacity="0.45" stroke-width="0.8"/>

    <!-- branding -->
    <text x="22" y="44" font-family="Helvetica" font-size="16" font-weight="bold" fill="#FFFFFF">NULLWEAR/V</text>
    <text x="22" y="60" font-family="Helvetica" font-size="9"  fill="#9CA3AF">VEHICLE UNIT  ·  Rev B  ·  ASN 0001-V</text>

    <!-- LED bank -->
    <g transform="translate(22,90)">
      <text x="0" y="-6" font-family="Helvetica" font-size="8" fill="#9CA3AF">STATUS</text>
      <circle cx="8"  cy="10" r="6" fill="url(#ledOn)"/>
      <circle cx="34" cy="10" r="6" fill="url(#ledRed)"/>
      <circle cx="60" cy="10" r="6" fill="url(#ledAmber)"/>
      <circle cx="86" cy="10" r="6" fill="url(#ledBlue)"/>
      <text x="8"  y="30" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#FFFFFF">PWR</text>
      <text x="34" y="30" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#FFFFFF">JAM</text>
      <text x="60" y="30" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#FFFFFF">FLT</text>
      <text x="86" y="30" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#FFFFFF">BLE</text>
    </g>

    <!-- 7-seg packet counter (cosmetic) -->
    <g transform="translate(150,82)">
      <rect x="0" y="0" width="120" height="40" rx="3" fill="#0A0F1F" stroke="#1F2937" stroke-width="1"/>
      <text x="60" y="28" font-family="Courier New, monospace" font-size="20" font-weight="bold" text-anchor="middle" fill="#22D3EE" letter-spacing="3">14289</text>
      <text x="60" y="-4" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#9CA3AF">PACKETS ANNIHILATED · SESSION</text>
    </g>

    <!-- ARM key switch -->
    <g transform="translate(298,80)">
      <text x="22" y="-4" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#9CA3AF">ARM</text>
      <circle cx="22" cy="22" r="20" fill="#1F2937" stroke="#000" stroke-width="0.8"/>
      <circle cx="22" cy="22" r="14" fill="#374151" stroke="#000" stroke-width="0.5"/>
      <line x1="22" y1="22" x2="22" y2="8"  stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
      <text x="22" y="56" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#FFFFFF">OFF | STBY | ON</text>
    </g>

    <!-- USB-C diagnostics -->
    <g transform="translate(22,150)">
      <rect x="0" y="0" width="22" height="6" rx="3" fill="#374151" stroke="#000" stroke-width="0.5"/>
      <text x="11" y="20" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#9CA3AF">USB-C  DIAG</text>
    </g>

    <!-- vent grille -->
    <g transform="translate(180,150)" stroke="#9CA3AF" stroke-width="0.6" fill="none">
      <line x1="0"  y1="0" x2="0"  y2="10"/>
      <line x1="3"  y1="0" x2="3"  y2="10"/>
      <line x1="6"  y1="0" x2="6"  y2="10"/>
      <line x1="9"  y1="0" x2="9"  y2="10"/>
      <line x1="12" y1="0" x2="12" y2="10"/>
      <line x1="15" y1="0" x2="15" y2="10"/>
      <line x1="18" y1="0" x2="18" y2="10"/>
      <line x1="21" y1="0" x2="21" y2="10"/>
      <line x1="24" y1="0" x2="24" y2="10"/>
      <line x1="27" y1="0" x2="27" y2="10"/>
      <line x1="30" y1="0" x2="30" y2="10"/>
      <line x1="33" y1="0" x2="33" y2="10"/>
      <line x1="36" y1="0" x2="36" y2="10"/>
      <line x1="39" y1="0" x2="39" y2="10"/>
      <line x1="42" y1="0" x2="42" y2="10"/>
      <line x1="45" y1="0" x2="45" y2="10"/>
    </g>

    <!-- anti-tamper screws -->
    <g fill="#6B7280" stroke="#000" stroke-width="0.4">
      <circle cx="8" cy="172"   r="3"/>
      <circle cx="372" cy="172" r="3"/>
      <circle cx="8" cy="8"     r="3"/>
      <circle cx="372" cy="8"   r="3"/>
    </g>

    <!-- callouts -->
    <g font-family="Helvetica" font-size="10" fill="#0B1B33">
      <line x1="60" y1="100" x2="60" y2="220" stroke="#0B1B33" stroke-width="0.8" marker-end="url(#cv)"/>
      <text x="60" y="234" text-anchor="middle">4-LED status</text>

      <line x1="210" y1="120" x2="210" y2="220" stroke="#0B1B33" stroke-width="0.8" marker-end="url(#cv)"/>
      <text x="210" y="234" text-anchor="middle">Session counter</text>

      <line x1="320" y1="125" x2="320" y2="220" stroke="#0B1B33" stroke-width="0.8" marker-end="url(#cv)"/>
      <text x="320" y="234" text-anchor="middle">Arm-key switch</text>

      <line x1="33" y1="156" x2="33" y2="278" stroke="#0B1B33" stroke-width="0.8" marker-end="url(#cv)"/>
      <text x="33" y="292" text-anchor="middle">USB-C diag</text>

      <line x1="200" y1="162" x2="160" y2="278" stroke="#0B1B33" stroke-width="0.8" marker-end="url(#cv)"/>
      <text x="160" y="292" text-anchor="middle">Convection vent</text>
    </g>
  </g>

  <!-- ===================== PERSPECTIVE / SIDE (RIGHT) ===================== -->
  <g transform="translate(490,90)">
    <text x="190" y="-12" font-family="Helvetica" font-size="13" font-weight="bold" text-anchor="middle" fill="#0B1B33">3/4 PERSPECTIVE</text>

    <!-- shadow under the device -->
    <ellipse cx="190" cy="246" rx="170" ry="8" fill="#000" opacity="0.18"/>

    <!-- mounting bracket (under) -->
    <polygon points="20,232 360,232 380,244 0,244" fill="url(#bracketV)" stroke="#000" stroke-width="0.8"/>
    <polygon points="0,244 380,244 350,250 30,250" fill="#374151" stroke="#000" stroke-width="0.6"/>
    <!-- bracket bolt heads -->
    <g fill="#1F2937" stroke="#000" stroke-width="0.4">
      <circle cx="40"  cy="240" r="3"/>
      <circle cx="340" cy="240" r="3"/>
    </g>

    <!-- chassis main body (perspective box) -->
    <polygon points="20,60 340,60 380,40 60,40" fill="url(#topV)" stroke="#000" stroke-width="1.2"/>
    <polygon points="20,60 340,60 340,232 20,232" fill="url(#caseV)" stroke="#000" stroke-width="1.2"/>
    <polygon points="340,60 380,40 380,212 340,232" fill="#142450" stroke="#000" stroke-width="1.2"/>

    <!-- branding on perspective face -->
    <text x="180" y="100" font-family="Helvetica" font-size="18" font-weight="bold" text-anchor="middle" fill="#FFFFFF">NULLWEAR/V</text>
    <text x="180" y="118" font-family="Helvetica" font-size="9"  text-anchor="middle" fill="#9CA3AF">VEHICLE UNIT</text>

    <!-- LED row hint on perspective face -->
    <g>
      <circle cx="60"  cy="160" r="4" fill="url(#ledOn)"/>
      <circle cx="78"  cy="160" r="4" fill="url(#ledRed)"/>
      <circle cx="96"  cy="160" r="4" fill="url(#ledAmber)"/>
      <circle cx="114" cy="160" r="4" fill="url(#ledBlue)"/>
    </g>

    <!-- counter hint -->
    <rect x="160" y="148" width="90" height="26" rx="2" fill="#0A0F1F" stroke="#1F2937" stroke-width="0.6"/>
    <text x="205" y="168" font-family="Courier New, monospace" font-size="14" font-weight="bold" text-anchor="middle" fill="#22D3EE" letter-spacing="2">14289</text>

    <!-- arm-key hint -->
    <circle cx="290" cy="160" r="14" fill="#1F2937" stroke="#000" stroke-width="0.5"/>
    <line x1="290" y1="160" x2="290" y2="150" stroke="#FBBF24" stroke-width="2"/>

    <!-- antenna stub on side -->
    <g transform="translate(370,52)">
      <rect x="0" y="0"  width="14" height="14" rx="2" fill="#1F2937" stroke="#000" stroke-width="0.6"/>
      <rect x="4" y="-32" width="6"  height="32" fill="#374151" stroke="#000" stroke-width="0.4"/>
      <circle cx="7" cy="-34" r="3" fill="#9CA3AF" stroke="#000" stroke-width="0.4"/>
    </g>

    <!-- 12V power input on rear (visible because of perspective) -->
    <g transform="translate(348,180)">
      <circle cx="6" cy="6" r="6" fill="#1F2937" stroke="#000" stroke-width="0.5"/>
      <circle cx="6" cy="6" r="2.4" fill="#FBBF24"/>
    </g>

    <!-- callouts -->
    <g font-family="Helvetica" font-size="10" fill="#0B1B33">
      <line x1="380" y1="22"  x2="430" y2="22"  stroke="#0B1B33" stroke-width="0.8" marker-end="url(#cv)" transform="translate(-50,0)"/>
      <text x="378" y="14" text-anchor="end">SMA-F antenna (BLE 2.4 GHz, λ/4 stub or external whip)</text>

      <line x1="354" y1="186" x2="406" y2="186" stroke="#0B1B33" stroke-width="0.8" marker-end="url(#cv)"/>
      <text x="408" y="190" text-anchor="start">12 V vehicle bus (ATC-fused)</text>

      <line x1="40" y1="240" x2="40" y2="290" stroke="#0B1B33" stroke-width="0.8" marker-end="url(#cv)"/>
      <text x="40" y="304" text-anchor="middle">M4 mount bolt (×4)</text>

      <line x1="190" y1="244" x2="190" y2="292" stroke="#0B1B33" stroke-width="0.8" marker-end="url(#cv)"/>
      <text x="190" y="306" text-anchor="middle">Steel mounting bracket (console / boot)</text>
    </g>
  </g>

  <!-- ===================== SPEC PANEL (BOTTOM) ===================== -->
  <g transform="translate(40,400)">
    <rect x="0" y="0" width="820" height="138" rx="6" fill="#F3F4F6" stroke="#0B1B33" stroke-width="1"/>
    <text x="14" y="20" font-family="Helvetica" font-size="12" font-weight="bold" fill="#0B1B33">DEVICE SPECIFICATION  ·  NULLWEAR/V</text>

    <g font-family="Helvetica" font-size="10" fill="#0B1B33">
      <!-- col 1 -->
      <text x="14" y="42" font-weight="bold">Form factor</text>
      <text x="14" y="56">120 × 80 × 32 mm</text>
      <text x="14" y="68">Aluminium chassis, ABS endcaps</text>
      <text x="14" y="80">270 g</text>

      <text x="14" y="100" font-weight="bold">Power</text>
      <text x="14" y="114">10.5–16 V DC (12 V vehicle bus)</text>
      <text x="14" y="126">8 W max  ·  3 W typical  ·  ATC fuse 2 A</text>

      <!-- col 2 -->
      <text x="220" y="42" font-weight="bold">Radio</text>
      <text x="220" y="56">Nordic nRF5340 (dual-core)</text>
      <text x="220" y="68">2.402–2.480 GHz, BLE adv only</text>
      <text x="220" y="80">+8 dBm TX max  ·  RX-triggered burst</text>

      <text x="220" y="100" font-weight="bold">Coverage</text>
      <text x="220" y="114">8–12 m radius (in-cabin + boot)</text>
      <text x="220" y="126">PAR ≥ 0.99 against Phase 1+2+3 sigs</text>

      <!-- col 3 -->
      <text x="430" y="42" font-weight="bold">I/O</text>
      <text x="430" y="56">USB-C (diag / firmware update)</text>
      <text x="430" y="68">SMA-F (antenna)</text>
      <text x="430" y="80">2-pin Deutsch DT (12 V in)</text>

      <text x="430" y="100" font-weight="bold">Environment</text>
      <text x="430" y="114">−20 °C to +70 °C cabin-rated</text>
      <text x="430" y="126">IP54 against road dust / spillage</text>

      <!-- col 4 -->
      <text x="620" y="42" font-weight="bold">Compliance</text>
      <text x="620" y="56">ACMA class licence (pending)</text>
      <text x="620" y="68">EMC: AS/NZS CISPR 32 Class B</text>
      <text x="620" y="80">Vehicle: ISO 7637-2 transient</text>

      <text x="620" y="100" font-weight="bold">Operational</text>
      <text x="620" y="114">Arm-key OFF / STBY / ON</text>
      <text x="620" y="126">Counter resets per ignition cycle</text>
    </g>
  </g>

  <!-- footer note -->
  <text x="450" y="552" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#666">
    Reference industrial design only — final dimensions, finish and connector choice TBD by selected contract manufacturer (see feasibility-pack/).
  </text>
</svg>
