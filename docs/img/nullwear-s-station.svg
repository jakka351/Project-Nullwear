<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 900 620" width="900" height="620">
  <defs>
    <marker id="cs" markerWidth="6" markerHeight="6" refX="3" refY="3" orient="auto" markerUnits="strokeWidth">
      <circle cx="3" cy="3" r="2" fill="#0B1B33"/>
    </marker>
    <linearGradient id="caseS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%"  stop-color="#1F2937"/>
      <stop offset="55%" stop-color="#111827"/>
      <stop offset="100%" stop-color="#030712"/>
    </linearGradient>
    <linearGradient id="topS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#374151"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="bezelS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#4B5563"/>
      <stop offset="100%" stop-color="#1F2937"/>
    </linearGradient>
    <linearGradient id="lcdS" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0%" stop-color="#082F49"/>
      <stop offset="100%" stop-color="#0C4A6E"/>
    </linearGradient>
    <radialGradient id="ledOn2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#34D399"/>
      <stop offset="100%" stop-color="#065F46"/>
    </radialGradient>
    <radialGradient id="ledRed2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#F87171"/>
      <stop offset="100%" stop-color="#7F1D1D"/>
    </radialGradient>
    <radialGradient id="ledAmber2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#FBBF24"/>
      <stop offset="100%" stop-color="#92400E"/>
    </radialGradient>
    <radialGradient id="ledBlue2" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#FFFFFF"/>
      <stop offset="40%" stop-color="#60A5FA"/>
      <stop offset="100%" stop-color="#1E3A8A"/>
    </radialGradient>
  </defs>

  <!-- background -->
  <rect width="900" height="620" fill="#FFFFFF"/>

  <!-- title -->
  <text x="450" y="32" font-family="Helvetica, Arial, sans-serif" font-size="20" font-weight="bold" text-anchor="middle" fill="#0B1B33">NULLWEAR/S — Station Unit</text>
  <text x="450" y="52" font-family="Helvetica, Arial, sans-serif" font-size="12" text-anchor="middle" fill="#666">Wall-mounted; covers a station foyer / muster-room / armoury. Triple-radio, mains-powered, Ethernet-monitored.</text>

  <!-- ===================== FRONT FACE (LEFT) ===================== -->
  <g transform="translate(40,90)">
    <text x="225" y="-12" font-family="Helvetica" font-size="13" font-weight="bold" text-anchor="middle" fill="#0B1B33">FRONT FACE</text>

    <!-- chassis -->
    <rect x="0" y="0" width="450" height="280" rx="10" fill="url(#caseS)" stroke="#000" stroke-width="1.4"/>
    <!-- bezel -->
    <rect x="6" y="6" width="438" height="20" rx="4" fill="url(#topS)" stroke="#000" stroke-opacity="0.4" stroke-width="0.6"/>

    <!-- branding -->
    <text x="22" y="22" font-family="Helvetica" font-size="14" font-weight="bold" fill="#FFFFFF">NULLWEAR/S</text>
    <text x="22" y="38" font-family="Helvetica" font-size="9"  fill="#9CA3AF">STATION UNIT  ·  Rev B  ·  ASN 0001-S</text>
    <text x="430" y="22" font-family="Helvetica" font-size="9"  text-anchor="end" fill="#9CA3AF">3-RADIO  ·  IP44  ·  90–264 VAC</text>

    <!-- LCD screen -->
    <g transform="translate(20,60)">
      <rect x="0" y="0" width="240" height="120" rx="3" fill="url(#bezelS)" stroke="#000" stroke-width="0.6"/>
      <rect x="6" y="6" width="228" height="108" rx="2" fill="url(#lcdS)" stroke="#000" stroke-width="0.4"/>
      <text x="14" y="22" font-family="Courier New, monospace" font-size="9" font-weight="bold" fill="#7DD3FC">NULLWEAR/S  v1.1.1</text>
      <text x="14" y="36" font-family="Courier New, monospace" font-size="8" fill="#7DD3FC">────────────────────────────</text>
      <text x="14" y="50" font-family="Courier New, monospace" font-size="8" fill="#A5F3FC">RADIO 0  CH 37  ARMED  OK</text>
      <text x="14" y="62" font-family="Courier New, monospace" font-size="8" fill="#A5F3FC">RADIO 1  CH 38  ARMED  OK</text>
      <text x="14" y="74" font-family="Courier New, monospace" font-size="8" fill="#A5F3FC">RADIO 2  CH 39  ARMED  OK</text>
      <text x="14" y="92" font-family="Courier New, monospace" font-size="8" fill="#FBBF24">PKTS / 24h:   428,194</text>
      <text x="14" y="104" font-family="Courier New, monospace" font-size="8" fill="#FBBF24">UNIQUE TGT:        17</text>
    </g>

    <!-- LED bank -->
    <g transform="translate(290,68)">
      <text x="0" y="-6" font-family="Helvetica" font-size="8" fill="#9CA3AF">SYSTEM STATUS</text>

      <circle cx="10" cy="10"  r="6" fill="url(#ledOn2)"/>
      <text x="22"   y="14" font-family="Helvetica" font-size="9" fill="#FFFFFF">MAINS</text>

      <circle cx="10" cy="32"  r="6" fill="url(#ledOn2)"/>
      <text x="22"   y="36" font-family="Helvetica" font-size="9" fill="#FFFFFF">ARMED</text>

      <circle cx="10" cy="54"  r="6" fill="url(#ledRed2)"/>
      <text x="22"   y="58" font-family="Helvetica" font-size="9" fill="#FFFFFF">JAMMING</text>

      <circle cx="10" cy="76"  r="6" fill="url(#ledAmber2)"/>
      <text x="22"   y="80" font-family="Helvetica" font-size="9" fill="#FFFFFF">FAULT</text>

      <circle cx="10" cy="98"  r="6" fill="url(#ledBlue2)"/>
      <text x="22"   y="102" font-family="Helvetica" font-size="9" fill="#FFFFFF">UPLINK</text>

      <circle cx="10" cy="120" r="6" fill="url(#ledAmber2)"/>
      <text x="22"   y="124" font-family="Helvetica" font-size="9" fill="#FFFFFF">TAMPER</text>
    </g>

    <!-- key switch -->
    <g transform="translate(290,210)">
      <text x="20" y="-4" font-family="Helvetica" font-size="7" fill="#9CA3AF" text-anchor="middle">SUPERVISOR ARM</text>
      <circle cx="20" cy="22" r="20" fill="#1F2937" stroke="#000" stroke-width="0.8"/>
      <circle cx="20" cy="22" r="14" fill="#374151" stroke="#000" stroke-width="0.5"/>
      <line x1="20" y1="22" x2="20" y2="8" stroke="#FBBF24" stroke-width="2.5" stroke-linecap="round"/>
      <text x="20" y="56" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#FFFFFF">OFF · TEST · ARM</text>
    </g>

    <!-- vent grille (large) -->
    <g transform="translate(20,210)">
      <rect x="0" y="0" width="240" height="40" rx="3" fill="#0A0F1F" stroke="#1F2937" stroke-width="0.6"/>
      <g stroke="#374151" stroke-width="0.6" fill="none">
        <line x1="6"  y1="6" x2="6"  y2="34"/>
        <line x1="14" y1="6" x2="14" y2="34"/>
        <line x1="22" y1="6" x2="22" y2="34"/>
        <line x1="30" y1="6" x2="30" y2="34"/>
        <line x1="38" y1="6" x2="38" y2="34"/>
        <line x1="46" y1="6" x2="46" y2="34"/>
        <line x1="54" y1="6" x2="54" y2="34"/>
        <line x1="62" y1="6" x2="62" y2="34"/>
        <line x1="70" y1="6" x2="70" y2="34"/>
        <line x1="78" y1="6" x2="78" y2="34"/>
        <line x1="86" y1="6" x2="86" y2="34"/>
        <line x1="94" y1="6" x2="94" y2="34"/>
        <line x1="102" y1="6" x2="102" y2="34"/>
        <line x1="110" y1="6" x2="110" y2="34"/>
        <line x1="118" y1="6" x2="118" y2="34"/>
        <line x1="126" y1="6" x2="126" y2="34"/>
        <line x1="134" y1="6" x2="134" y2="34"/>
        <line x1="142" y1="6" x2="142" y2="34"/>
        <line x1="150" y1="6" x2="150" y2="34"/>
        <line x1="158" y1="6" x2="158" y2="34"/>
        <line x1="166" y1="6" x2="166" y2="34"/>
        <line x1="174" y1="6" x2="174" y2="34"/>
        <line x1="182" y1="6" x2="182" y2="34"/>
        <line x1="190" y1="6" x2="190" y2="34"/>
        <line x1="198" y1="6" x2="198" y2="34"/>
        <line x1="206" y1="6" x2="206" y2="34"/>
        <line x1="214" y1="6" x2="214" y2="34"/>
        <line x1="222" y1="6" x2="222" y2="34"/>
        <line x1="230" y1="6" x2="230" y2="34"/>
      </g>
      <text x="120" y="55" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#9CA3AF">CONVECTION INTAKE  ·  PRE-FILTERED</text>
    </g>

    <!-- anti-tamper screws -->
    <g fill="#6B7280" stroke="#000" stroke-width="0.4">
      <circle cx="12"  cy="12"  r="3"/>
      <circle cx="438" cy="12"  r="3"/>
      <circle cx="12"  cy="268" r="3"/>
      <circle cx="438" cy="268" r="3"/>
    </g>

    <!-- callouts -->
    <g font-family="Helvetica" font-size="10" fill="#0B1B33">
      <line x1="140" y1="180" x2="140" y2="320" stroke="#0B1B33" stroke-width="0.8" marker-end="url(#cs)"/>
      <text x="140" y="334" text-anchor="middle">128×64 OLED status display</text>

      <line x1="310" y1="180" x2="310" y2="320" stroke="#0B1B33" stroke-width="0.8" marker-end="url(#cs)"/>
      <text x="310" y="334" text-anchor="middle">6-LED system bank</text>

      <line x1="310" y1="240" x2="380" y2="320" stroke="#0B1B33" stroke-width="0.8" marker-end="url(#cs)"/>
      <text x="380" y="334" text-anchor="middle">Supervisor key switch</text>

      <line x1="140" y1="252" x2="80" y2="320" stroke="#0B1B33" stroke-width="0.8" marker-end="url(#cs)"/>
      <text x="80" y="334" text-anchor="middle">Convection vent</text>
    </g>
  </g>

  <!-- ===================== PERSPECTIVE / WALL MOUNT (RIGHT) ===================== -->
  <g transform="translate(560,90)">
    <text x="160" y="-12" font-family="Helvetica" font-size="13" font-weight="bold" text-anchor="middle" fill="#0B1B33">WALL-MOUNT VIEW</text>

    <!-- wall hatch background -->
    <pattern id="wall" x="0" y="0" width="14" height="14" patternUnits="userSpaceOnUse">
      <rect width="14" height="14" fill="#F3F4F6"/>
      <line x1="0" y1="0" x2="14" y2="14" stroke="#D1D5DB" stroke-width="0.4"/>
    </pattern>
    <rect x="-10" y="-2" width="340" height="320" fill="url(#wall)" stroke="#9CA3AF" stroke-width="0.8"/>
    <text x="6" y="14" font-family="Helvetica" font-size="8" fill="#6B7280">WALL (interior)</text>

    <!-- wall mount bracket -->
    <rect x="40" y="48" width="240" height="14" fill="#9CA3AF" stroke="#000" stroke-width="0.6"/>
    <rect x="40" y="244" width="240" height="14" fill="#9CA3AF" stroke="#000" stroke-width="0.6"/>
    <g fill="#1F2937" stroke="#000" stroke-width="0.4">
      <circle cx="60"  cy="55" r="2.6"/>
      <circle cx="260" cy="55" r="2.6"/>
      <circle cx="60"  cy="251" r="2.6"/>
      <circle cx="260" cy="251" r="2.6"/>
    </g>

    <!-- chassis (perspective angled) -->
    <polygon points="60,80 280,80 290,72 70,72" fill="url(#topS)" stroke="#000" stroke-width="1.0"/>
    <polygon points="60,80 280,80 280,240 60,240" fill="url(#caseS)" stroke="#000" stroke-width="1.2"/>
    <polygon points="280,80 290,72 290,232 280,240" fill="#0F172A" stroke="#000" stroke-width="1.0"/>
    <polygon points="60,240 280,240 270,248 70,248" fill="#1F2937" stroke="#000" stroke-width="1.0"/>

    <!-- branding hint -->
    <text x="170" y="100" font-family="Helvetica" font-size="11" font-weight="bold" text-anchor="middle" fill="#FFFFFF">NULLWEAR/S</text>

    <!-- LCD hint -->
    <rect x="74" y="110" width="120" height="58" rx="2" fill="url(#lcdS)" stroke="#000" stroke-width="0.4"/>
    <text x="134" y="128" font-family="Courier New, monospace" font-size="6" text-anchor="middle" fill="#7DD3FC">NULLWEAR/S v1.1.1</text>
    <text x="134" y="142" font-family="Courier New, monospace" font-size="6" text-anchor="middle" fill="#A5F3FC">3 RADIOS  ARMED</text>
    <text x="134" y="156" font-family="Courier New, monospace" font-size="6" text-anchor="middle" fill="#FBBF24">PKTS/24h 428194</text>

    <!-- LEDs hint -->
    <g>
      <circle cx="220" cy="118" r="3" fill="url(#ledOn2)"/>
      <circle cx="220" cy="130" r="3" fill="url(#ledOn2)"/>
      <circle cx="220" cy="142" r="3" fill="url(#ledRed2)"/>
      <circle cx="220" cy="154" r="3" fill="url(#ledAmber2)"/>
      <circle cx="220" cy="166" r="3" fill="url(#ledBlue2)"/>
    </g>

    <!-- vent hint -->
    <rect x="74" y="184" width="180" height="20" rx="2" fill="#0A0F1F" stroke="#1F2937" stroke-width="0.4"/>

    <!-- 3 antennas on top -->
    <g>
      <rect x="100" y="44" width="6" height="32" fill="#374151" stroke="#000" stroke-width="0.4"/>
      <rect x="167" y="44" width="6" height="32" fill="#374151" stroke="#000" stroke-width="0.4"/>
      <rect x="234" y="44" width="6" height="32" fill="#374151" stroke="#000" stroke-width="0.4"/>
      <rect x="98"  y="20" width="10" height="26" rx="3" fill="#1F2937" stroke="#000" stroke-width="0.4"/>
      <rect x="165" y="20" width="10" height="26" rx="3" fill="#1F2937" stroke="#000" stroke-width="0.4"/>
      <rect x="232" y="20" width="10" height="26" rx="3" fill="#1F2937" stroke="#000" stroke-width="0.4"/>
    </g>

    <!-- AC inlet underneath -->
    <rect x="100" y="252" width="36" height="14" rx="2" fill="#1F2937" stroke="#000" stroke-width="0.5"/>
    <text x="118" y="278" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#0B1B33">IEC C14</text>

    <!-- Ethernet underneath -->
    <rect x="170" y="252" width="22" height="14" rx="1.5" fill="#1F2937" stroke="#000" stroke-width="0.5"/>
    <rect x="174" y="256" width="14" height="6" fill="#FBBF24" opacity="0.6"/>
    <text x="181" y="278" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#0B1B33">RJ-45</text>

    <!-- Tamper switch underneath -->
    <circle cx="226" cy="259" r="6" fill="#1F2937" stroke="#000" stroke-width="0.5"/>
    <circle cx="226" cy="259" r="2" fill="#F87171"/>
    <text x="226" y="278" font-family="Helvetica" font-size="7" text-anchor="middle" fill="#0B1B33">Tamper</text>

    <!-- callouts -->
    <g font-family="Helvetica" font-size="10" fill="#0B1B33">
      <line x1="103" y1="18" x2="60"  y2="18" stroke="#0B1B33" stroke-width="0.8" marker-end="url(#cs)"/>
      <text x="56" y="14" text-anchor="end">3× λ/4 BLE 2.4 GHz antennas (CH 37/38/39 dedicated)</text>

      <line x1="50" y1="55"  x2="-4" y2="55"  stroke="#0B1B33" stroke-width="0.8" marker-end="url(#cs)"/>
      <text x="-6" y="58" text-anchor="end">Wall mount rail</text>

      <line x1="118" y1="270" x2="118" y2="306" stroke="#0B1B33" stroke-width="0.8" marker-end="url(#cs)"/>
      <text x="118" y="320" text-anchor="middle">Mains in</text>

      <line x1="181" y1="270" x2="181" y2="306" stroke="#0B1B33" stroke-width="0.8" marker-end="url(#cs)"/>
      <text x="181" y="320" text-anchor="middle">Status uplink</text>

      <line x1="226" y1="270" x2="226" y2="306" stroke="#0B1B33" stroke-width="0.8" marker-end="url(#cs)"/>
      <text x="226" y="320" text-anchor="middle">Tamper sw</text>
    </g>
  </g>

  <!-- ===================== SPEC PANEL (BOTTOM) ===================== -->
  <g transform="translate(40,440)">
    <rect x="0" y="0" width="820" height="158" rx="6" fill="#F3F4F6" stroke="#0B1B33" stroke-width="1"/>
    <text x="14" y="20" font-family="Helvetica" font-size="12" font-weight="bold" fill="#0B1B33">DEVICE SPECIFICATION  ·  NULLWEAR/S</text>

    <g font-family="Helvetica" font-size="10" fill="#0B1B33">
      <!-- col 1 -->
      <text x="14" y="42" font-weight="bold">Form factor</text>
      <text x="14" y="56">300 × 200 × 65 mm</text>
      <text x="14" y="68">Powder-coated steel chassis</text>
      <text x="14" y="80">2.6 kg incl. mount</text>

      <text x="14" y="100" font-weight="bold">Power</text>
      <text x="14" y="114">90–264 VAC, 47–63 Hz, IEC C14</text>
      <text x="14" y="126">30 W max  ·  9 W typical</text>
      <text x="14" y="138">Internal supercap 30 s ride-through</text>

      <!-- col 2 -->
      <text x="220" y="42" font-weight="bold">Radio (×3)</text>
      <text x="220" y="56">3× Nordic nRF5340 dual-core</text>
      <text x="220" y="68">One per BLE adv channel (37/38/39)</text>
      <text x="220" y="80">+8 dBm TX max  ·  no time-share latency</text>

      <text x="220" y="100" font-weight="bold">Coverage</text>
      <text x="220" y="114">15–25 m radius (open foyer)</text>
      <text x="220" y="126">PAR ≥ 0.99 against Phase 1+2+3 sigs</text>
      <text x="220" y="138">Survey-tested at install per docs/10</text>

      <!-- col 3 -->
      <text x="430" y="42" font-weight="bold">I/O</text>
      <text x="430" y="56">3× SMA-F (one per radio)</text>
      <text x="430" y="68">RJ-45 100BASE-TX (uplink)</text>
      <text x="430" y="80">USB-C concealed (firmware update)</text>
      <text x="430" y="92">Tamper micro-switch (chassis)</text>

      <text x="430" y="112" font-weight="bold">Environment</text>
      <text x="430" y="126">0 °C to +50 °C indoor-rated</text>
      <text x="430" y="138">IP44 against incidental wash-down</text>

      <!-- col 4 -->
      <text x="620" y="42" font-weight="bold">Compliance</text>
      <text x="620" y="56">ACMA class licence (pending)</text>
      <text x="620" y="68">EMC: AS/NZS CISPR 32 Class B</text>
      <text x="620" y="80">Safety: AS/NZS 62368.1</text>

      <text x="620" y="100" font-weight="bold">Operational</text>
      <text x="620" y="114">Supervisor-key OFF / TEST / ARM</text>
      <text x="620" y="126">Per-radio armed-LED + fault-LED</text>
      <text x="620" y="138">JSON status push (uplink, 60 s)</text>
    </g>
  </g>

  <!-- footer note -->
  <text x="450" y="612" font-family="Helvetica" font-size="9" text-anchor="middle" fill="#666">
    Reference industrial design only — final dimensions, finish and connector choice TBD by selected contract manufacturer (see feasibility-pack/).
  </text>
</svg>
